<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Quiz Gate Settings</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      max-width: 32rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .section-title {
      font-size: 16px;
      margin-top: 1.5rem;
      margin-bottom: 0.625rem;
    }

    .difficulty-options label {
      display: block;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }

    #languageSelect {
      width: 100%;
      padding: 0.5rem;
      border-radius: 5px;
      border: 1px solid var(--light-gray-color);
    }

    .status {
      margin-top: 1rem;
      font-size: 13px;
      color: var(--success-color);
      min-height: 1rem;
    }
  </style>
</head>

<body>
  <h1>Quiz Gate Settings</h1>
  <p>These settings are shared with the popup and apply immediately.</p>

  <h2 class="section-title">Link Blocker</h2>
  <label>
    <input type="checkbox" id="powerToggle" /> Enabled
  </label>

  <h2 class="section-title">Difficulty</h2>
  <div class="difficulty-options">
    <label>
      <input type="radio" name="difficulty" value="easy" /> Easy
    </label>
    <label>
      <input type="radio" name="difficulty" value="medium" /> Medium
    </label>
    <label>
      <input type="radio" name="difficulty" value="hard" /> Hard
    </label>
  </div>

  <h2 class="section-title">Language</h2>
  <select id="languageSelect">
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="de">Deutsch</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
    <option value="ko">한국어</option>
    <option value="pt">Português</option>
    <option value="ru">Русский</option>
    <option value="zh">中文</option>
    <option value="tr">Türkçe</option>
    <option value="ar">العربية</option>
    <option value="hi">हिन्दी</option>
  </select>

  <div class="status" id="status"></div>

  <script src="./options.js"></script>
</body>

</html>
