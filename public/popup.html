<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Quiz Gate Settings</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="header-row">
    <span class="title">Link Blocker</span>
    <label class="toggle-switch">
      <input type="checkbox" id="powerToggle">
      <span class="slider"></span>
    </label>
  </div>

  <hr />

  <h1 class="section-title">Difficulty</h1>
  <div class="difficulty-options">
    <button class="button" data-difficulty="easy">Easy</button>
    <button class="button" data-difficulty="medium">Medium</button>
    <button class="button" data-difficulty="hard">Hard</button>
  </div>

  <h1 class="section-title">Language</h1>
  <select id="languageSelect">
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="de">Deutsch</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
    <option value="ko">한국어</option>
    <option value="pt">Português</option>
    <option value="ru">Русский</option>
    <option value="zh">中文</option>
    <option value="tr">Türkçe</option>
    <option value="ar">العربية</option>
    <option value="hi">हिन्दी</option>
  </select>

  <div class="status" id="status"></div>

  <script src="./popup.js"></script>
</body>

</html>
