<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Quiz Gate Settings</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      margin: 10px;
      min-width: 210px;
    }

    h1 {
      font-size: 14px;
      margin: 8px 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .title {
      font-weight: 600;
    }

    .power-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 2px 4px;
    }

    .power-icon {
      position: relative;
      width: 20px;
      height: 20px;
    }

    /* 外側の円 */
    .power-icon::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 2px solid #666;
      background: transparent;
      transition: border-color 0.15s, background-color 0.15s;
    }

    /* 上の縦棒 */
    .power-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 1px;
      width: 3px;
      height: 9px;
      border-radius: 999px;
      transform: translateX(-50%);
      background-color: #666;
      transition: background-color 0.15s;
    }

    .power-text {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      min-width: 26px;
      text-align: left;
    }

    /* ON の見た目 */
    .power-btn.on .power-icon::before {
      border-color: #22c55e;
      /* 緑アウトライン */
      background-color: #22c55e33;
      /* 薄い緑の塗り */
    }

    .power-btn.on .power-icon::after {
      background-color: #16a34a;
    }

    .power-btn.on .power-text {
      color: #16a34a;
    }

    /* OFF の見た目 */
    .power-btn.off .power-icon::before,
    .power-btn.off .power-icon::after,
    .power-btn.off .power-text {
      color: #999;
      border-color: #999;
      background-color: transparent;
    }

    button#save {
      margin-top: 8px;
      width: 100%;
    }

    .status {
      margin-top: 4px;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="header-row">
    <span class="title">Link blocker</span>
    <button id="powerToggle" class="power-btn" aria-pressed="true">
      <span class="power-icon"></span>
      <span id="powerText" class="power-text">ON</span>
    </button>
  </div>

  <hr />

  <h1>Difficulty</h1>
  <label>
    <input type="radio" name="difficulty" value="easy" /> easy
  </label>
  <label>
    <input type="radio" name="difficulty" value="medium" /> medium
  </label>
  <label>
    <input type="radio" name="difficulty" value="hard" /> hard
  </label>

  <h1 id="languageHeading">Language</h1>
  <label class="sr-only" for="languageSelect">Language</label>
  <select id="languageSelect" aria-labelledby="languageHeading">
    <option value="de">Deutsch</option>
    <option value="en">English</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="pt">Português</option>
    <option value="ru">Русский</option>
    <option value="zh">中文</option>
  </select>

  <button id="save">Save difficulty</button>
  <div class="status" id="status"></div>

  <script src="./popup.js"></script>
</body>

</html>
